apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: abl-mcp-control
  namespace: abl-mcp
  labels:
    app.kubernetes.io/name: abl-mcp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: abl-mcp-artifacts
  namespace: abl-mcp
  labels:
    app.kubernetes.io/name: abl-mcp
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Gi
