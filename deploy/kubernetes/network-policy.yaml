apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: abl-mcp-default-deny
  namespace: abl-mcp
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: abl-mcp-allow-edge
  namespace: abl-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: abl-mcp
      app.kubernetes.io/component: server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              abl-mcp.example/access: "true"
      ports:
        - protocol: TCP
          port: 3333
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: abl-mcp-allow-dns
  namespace: abl-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: abl-mcp
      app.kubernetes.io/component: server
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: abl-mcp-allow-identity-egress
  namespace: abl-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: abl-mcp
      app.kubernetes.io/component: server
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              abl-mcp.example/identity-egress: "true"
          podSelector:
            matchLabels:
              abl-mcp.example/identity-gateway: "true"
      ports:
        - protocol: TCP
          port: 443
