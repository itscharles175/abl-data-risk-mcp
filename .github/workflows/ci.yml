name: ci

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify, package, and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: abl-mcp-server:${{ github.sha }}
      PNPM_VERSION: 11.16.0
      SYFT_IMAGE: anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0
      TRIVY_IMAGE: aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
      KUSTOMIZE_IMAGE: registry.k8s.io/kustomize/kustomize@sha256:899fcd3bc898160e62bcaf82932b0cb29ba38d16272353db2e7acbba82129429
      ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.1

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install --global "pnpm@${PNPM_VERSION}"
          pnpm install --frozen-lockfile

      - name: Verify source and production dependencies
        run: |
          set -euo pipefail
          pnpm run verify
          pnpm run audit:prod

      - name: Validate deployment manifests
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "${PWD}:/work:ro" \
            --workdir /work \
            "${ACTIONLINT_IMAGE}" \
            .github/workflows/ci.yml
          docker compose -f deploy/compose.yaml --profile remote config > compose.rendered.yaml
          test -s compose.rendered.yaml
          ruby -e 'require "yaml"; YAML.safe_load(File.read("deploy/kubernetes/kustomization.yaml"), permitted_classes: [], permitted_symbols: [], aliases: false)'
          docker run --rm \
            --volume "${PWD}:/work:ro" \
            "${KUSTOMIZE_IMAGE}" \
            build /work/deploy/kubernetes > kubernetes.rendered.yaml
          test -s kubernetes.rendered.yaml
          docker run --rm \
            --volume "${PWD}:/work:ro" \
            "${KUBECONFORM_IMAGE}" \
            -strict \
            -summary \
            /work/kubernetes.rendered.yaml
          docker run --rm \
            --volume "${PWD}:/work:ro" \
            "${TRIVY_IMAGE}" \
            config \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            /work

      - name: Build and smoke-test container
        run: |
          set -euo pipefail
          docker build --pull --check .
          docker build \
            --pull \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag "${IMAGE}" \
            .
          test "$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")" = "65532:65532"
          docker run --rm \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint /nodejs/bin/node \
            "${IMAGE}" \
            -e 'const fs=require("node:fs");if(!fs.statSync("/app/dist/remote-cli.js").isFile())process.exit(1)'
          docker run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint /nodejs/bin/node \
            "${IMAGE}" \
            /app/dist/cli.js --help

      - name: Generate SBOM
        run: |
          set -euo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            "${SYFT_IMAGE}" \
            "docker:${IMAGE}" \
            --output cyclonedx-json > sbom.cdx.json
          test -s sbom.cdx.json

      - name: Scan image and repository secrets
        run: |
          set -euo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "${HOME}/.cache/trivy:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            "${IMAGE}"
          docker run --rm \
            --volume "${PWD}:/work:ro" \
            --volume "${HOME}/.cache/trivy:/root/.cache/trivy" \
            "${TRIVY_IMAGE}" \
            filesystem \
            --scanners secret \
            --skip-dirs /work/.git \
            --skip-dirs /work/node_modules \
            --exit-code 1 \
            /work

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            sbom.cdx.json
            compose.rendered.yaml
            kubernetes.rendered.yaml
          if-no-files-found: warn
          retention-days: 30
